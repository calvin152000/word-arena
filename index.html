<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Word Arena</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #080818;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
#cabinet {
  position: relative;
  background: linear-gradient(170deg, #181830 0%, #0d0d20 60%, #12122a 100%);
  border-radius: 20px 20px 14px 14px;
  padding: 20px 26px 24px;
  border: 2px solid #252550;
  box-shadow: 0 0 0 4px #09091c, 0 0 0 6px #1c1c40, 0 10px 50px rgba(0,0,0,0.9), inset 0 1px 0 rgba(80,80,180,0.12);
}
#screen-wrap {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 3px #04040e, 0 0 0 5px #18184a, 0 0 40px rgba(0,180,255,0.15), inset 0 0 80px rgba(0,0,0,0.6);
}
canvas { display: block; width: 600px; height: 700px; }
#scanlines {
  position: absolute; inset: 0; pointer-events: none; border-radius: 10px;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
}
#vignette {
  position: absolute; inset: 0; pointer-events: none; border-radius: 10px;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,15,0.55) 78%, rgba(0,0,8,0.9) 100%);
}
#cab-footer { text-align: center; font-family: 'Press Start 2P', monospace; font-size: 7px; color: #2a2a55; margin-top: 10px; letter-spacing: 3px; }
#cab-deco { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 8px; }
.slot { width: 38px; height: 4px; background: #0a0a1e; border-radius: 2px; border: 1px solid #222244; }
.led { width: 7px; height: 7px; border-radius: 50%; animation: led 2s ease-in-out infinite alternate; }
.led.a { background:#00e5cc; box-shadow:0 0 7px #00e5cc; animation-delay:0s; }
.led.b { background:#4488ff; box-shadow:0 0 7px #4488ff; animation-delay:.7s; }
.led.c { background:#bb66ff; box-shadow:0 0 7px #bb66ff; animation-delay:1.3s; }
@keyframes led { from{opacity:.25} to{opacity:1} }
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

// ── NO-REPEAT WORD POOL ───────────────────────────────────────────────────────
// Shuffle an array using Fisher-Yates
function shuffleArr(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// Per-difficulty shuffled queues + used sets
const wordQueues={};
const wordUsed={};
function initWordPool(diff){
  wordQueues[diff]=shuffleArr(WORDS[diff]||WORDS.easy);
  wordUsed[diff]=new Set();
}
// Draw next unique word from pool; recycles when exhausted
function drawWord(diff){
  if(!wordQueues[diff]||wordQueues[diff].length===0){
    // Re-shuffle and reset used set when pool runs out
    wordQueues[diff]=shuffleArr(WORDS[diff]||WORDS.easy);
    wordUsed[diff]=new Set();
  }
  const w=wordQueues[diff].shift();
  wordUsed[diff].add(w);
  return w;
}

// ── SEEDED PRNG ───────────────────────────────────────────────────────────────
function seededRand(seed){
  let t = seed + 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14)>>>0) / 4294967296;
}

    osc.type="triangle"; osc.frequency.setValueAtTime(freq,now);
    harm.type="sine"; harm.frequency.setValueAtTime(freq*0.5,now);
    if(pitchEnd&&pitchEnd!==freq){ osc.frequency.exponentialRampToValueAtTime(pitchEnd,now+dur); harm.frequency.exponentialRampToValueAtTime(pitchEnd*0.5,now+dur); }
    const atk=Math.min(0.012,dur*0.12);
    env.gain.setValueAtTime(0,now); env.gain.linearRampToValueAtTime(vol,now+atk);
    env.gain.setValueAtTime(vol*0.7,now+dur*0.5); env.gain.linearRampToValueAtTime(0,now+dur+0.02);

}

function scheduleDrums(startT,bars=2){
  const barLen=4*BEAT;

    const t=startT+b*barLen;
    [0,2].forEach(beat=>scheduleKick(t+beat*BEAT));
    [1,3].forEach(beat=>scheduleSnare(t+beat*BEAT));

function pixelBox(b,color=C.teal){

  ctx.strokeStyle=`rgba(${rgb},${hovered?0.35:0.2})`; ctx.lineWidth=1; ctx.strokeRect(b.x+4,b.y+4,b.w-8,b.h-8);

  ctx.fillRect(b.x,b.y+b.h-2,s,2);ctx.fillRect(b.x,b.y+b.h-s,2,s);
  ctx.fillRect(b.x+b.w-s,b.y+b.h-2,s,2);ctx.fillRect(b.x+b.w-2,b.y+b.h-s,2,s);

// ── NETWORK ───────────────────────────────────────────────────────────────────
// Architecture (same for 2P and 4P):
//   HOST opens Peer at "wArena-<code>". Guests connect to it.
//   Every message goes through host (hub-and-spoke).
//   If host leaves: remaining guests elect new host by sorted peerId (lowest wins).
//   New host reopens on the SAME room code so other guests can reconnect seamlessly.

let myPeer=null, hostConn=null, guestConns=[];

// ── HOST PEER SETUP ─────────────────────────────────────────────────────────────────────────────────
function openHostPeer(code, peerId, retriesLeft){
  if(myPeer){ try{myPeer.destroy();}catch(e){} myPeer=null; }
  const usingRoomCode = !peerId; // true = attempting the shareable "wArena-"+code id
  const remaining = (retriesLeft===undefined) ? 5 : retriesLeft;
  myPeer = new Peer(peerId||("wArena-"+code), {
    config:{ iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"},
      {urls:"stun:global.stun.twilio.com:3478"},
      {urls:"stun:global.relay.metered.ca:80"},
      {urls:"turn:global.relay.metered.ca:80", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
      {urls:"turn:global.relay.metered.ca:80?transport=tcp", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
      {urls:"turn:global.relay.metered.ca:443", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
      {urls:"turns:global.relay.metered.ca:443?transport=tcp", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
    ], iceCandidatePoolSize:10},
    debug:0
  });
  myPeer.on("open", ()=>{
    startLobbyHeartbeat();
    myPeer.on("connection", (conn)=>{
      conn.on("open", ()=>{
        guestConns.push(conn);
        conn.on("data", (data)=>{
          if(data.type==="join" && data.from){ conn._peerId=data.from; }
          if(data.type==="gamestate"||data.type==="wordcleared") onGameMsg(data, conn);
          else onLobbyMsg(data, conn);
        });
        conn.on("close", ()=>{
          guestConns = guestConns.filter(c=>c!==conn);
          const disconnectedId = conn._peerId ||
            Object.keys(lobbyPeers).find(id => lobbyPeers[id]?.conn === conn);
          // Bug fix: if this peer already reconnected with a NEW connection (e.g. rematch
          // race — guest opened a fresh conn before this stale conn's "close" fired),
          // lobbyPeers[disconnectedId].conn will no longer match `conn`. In that case this
          // is a late/stale close event — skip cleanup so we don't wipe the live reconnection.
          if(disconnectedId && lobbyPeers[disconnectedId] && lobbyPeers[disconnectedId].conn!==conn){
            return;
          }
          let disconnectedSlot;
          if(disconnectedId){
            disconnectedSlot = remoteStates[disconnectedId]?.slotIdx;
            delete lobbyPeers[disconnectedId];
            delete remoteStates[disconnectedId];
          }
          lobby.players = Object.keys(lobbyPeers).length+1;
          lobbyReadyCount = Object.values(lobbyPeers).filter(p=>p.ready).length+(myReady?1:0);
          if(state==="game" && disconnectedSlot!==undefined && players[disconnectedSlot]){
            players[disconnectedSlot].dead = true;
            players[disconnectedSlot].disconnected = true;
            broadcastLobby({type:"player_disconnected", slotIdx:disconnectedSlot, peerId:disconnectedId});
          }
          broadcastLobby({type:"sync_peers", total:lobby.players, hostPeerId:myPlayerId, hostConnectId:myPeer&&myPeer.id,
            peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});
          if(countdownActive){countdownActive=false;if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}broadcastLobby({type:"countdown_cancel"});sfxMiss();}
          sfxMiss();
        });
        conn.on("error", e=>console.warn("Guest conn error:",e));
        // Send welcome so guest knows who is here
        conn.send({type:"welcome", from:myPlayerId, name:username||"HOST",
          hostReady:myReady, hostPeerId:myPlayerId, hostConnectId:myPeer.id, code, required:lobby.required,
          peers:Object.entries(lobbyPeers).filter(([id])=>id!==conn._peerId)
            .map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});
      });
    });
  });
  myPeer.on("error", e=>{
    console.warn("Host peer error:", e);
    if(usingRoomCode && e && e.type==="unavailable-id" && remaining>0){
      // Original host's room-code ID may not have been freed by the signaling
      // server yet — retry a few times before giving up on the shareable code.
      setTimeout(()=> openHostPeer(code, null, remaining-1), 1000);
    } else if(usingRoomCode && remaining<=0){
      // Room code still unavailable — fall back to our own stable id so
      // already-known guests (via hostConnectId) can still find us. Brand-new
      // joiners using the original code won't reach us in this rare case.
      openHostPeer(code, myPlayerId);
    } else {
      if(state==="lobby_wait") joinErrorMsg="HOST ERROR — TRY AGAIN";
    }
  });
}

function openGuestPeerById(targetPeerId){
  joinErrorMsg = "RECONNECTING...";
  if(myPeer && myPeer.open){
    _doGuestConnectById(targetPeerId, 0);
  } else {
    if(myPeer){ try{myPeer.destroy();}catch(e){} myPeer=null; }
    myPeer = new Peer({

        {urls:"turn:global.relay.metered.ca:80?transport=tcp", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
        {urls:"turn:global.relay.metered.ca:443", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},

      ], iceCandidatePoolSize:10}
    });
    myPeer.on("open", ()=> _doGuestConnectById(targetPeerId, 0));
    myPeer.on("error", ()=>{ joinErrorMsg="RECONNECT FAILED"; sfxMiss(); });
  }

function _doGuestConnectById(targetPeerId, retries){
  if(hostConn){ try{hostConn.close();}catch(e){} hostConn=null; }
  const conn = myPeer.connect(targetPeerId, {reliable:true, serialization:"json"});
  hostConn = conn;

  const timeout = setTimeout(()=>{
    if(!conn.open){
      conn.close();
      if(retries < 10){
        setTimeout(()=> _doGuestConnectById(targetPeerId, retries+1), 1000);
      } else {
        hostConn=null;
        joinErrorMsg="RECONNECT FAILED — HOST GONE";
        sfxMiss();
      }
    }
  }, 5000);

  conn.on("open", ()=>{
    clearTimeout(timeout);
    joinErrorMsg="";
    conn.send({type:"join", from:myPlayerId, name:username||"P?", required:playerCount});
    conn.on("data", (data)=>{
      if(data.type==="gamestate"||data.type==="wordcleared") onGameMsg(data, conn);
      else onLobbyMsg(data, conn);
    });
    conn.on("close", ()=>{
      // Host disconnected again — try migration again
      if(state==="lobby_wait"||state==="game"||state==="gameover_multi"){
        attemptHostMigration();
      }
    });
    state="lobby_wait";
    sfxPlayerJoin();
  });

  conn.on("error", ()=>{
    clearTimeout(timeout);
    hostConn=null;
    if(retries < 10){
      setTimeout(()=> _doGuestConnectById(targetPeerId, retries+1), 1000);
    } else {
      joinErrorMsg="RECONNECT FAILED";
      sfxMiss();
    }
  });
}

function openGuestPeer(code, isMigration){
  // Guest connects to host at wArena-<code>

  // Only show reconnecting message in lobby — during game/gameover migrate silently
  joinErrorMsg = (isMigration && state==="lobby_wait") ? "RECONNECTING..." : (!isMigration ? "" : joinErrorMsg);

  if(myPeer && myPeer.open){
    _doGuestConnect(code, isMigration, 0);
  } else {
    if(myPeer){ try{myPeer.destroy();}catch(e){} myPeer=null; }
    myPeer = new Peer({

        {urls:"turn:global.relay.metered.ca:443", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
        {urls:"turns:global.relay.metered.ca:443?transport=tcp", username:"d74b711e41036bbc95c59e50", credential:"k/qyRXeLLtR9hKZF"},
      ], iceCandidatePoolSize:10}
    });
    myPeer.on("open", ()=> _doGuestConnect(code, isMigration, 0));
    myPeer.on("error", (err)=>{
      joinConnecting=false;
      joinErrorMsg = isMigration ? "RECONNECT FAILED" : "PEER ERROR — TRY AGAIN";
      sfxMiss();
    });
  }
}

function _doGuestConnect(code, isMigration, retries){
  if(hostConn){ try{hostConn.close();}catch(e){} hostConn=null; }

  const conn = myPeer.connect("wArena-"+code, {reliable:true, serialization:"json"});
  hostConn = conn;

  const timeout = setTimeout(()=>{
    if(!conn.open){
      conn.close();
      if(retries < 10){
        setTimeout(()=>_doGuestConnect(code, isMigration, retries+1), 300);
      } else if(isMigration && lobby.hostPeerId){
        // New host may have failed to reclaim the room code and fallen back
        // to their own player id — try that directly as a last resort.
        hostConn=null; joinConnecting=false;
        openGuestPeerById(lobby.hostPeerId);
      } else {
        hostConn=null; joinConnecting=false;
        joinErrorMsg = isMigration ? "RECONNECT FAILED — HOST GONE" : "TIMEOUT — CHECK CODE & TRY AGAIN";
        sfxMiss();
      }
    }
  }, 2200);

  conn.on("open", ()=>{
    clearTimeout(timeout);
    joinConnecting=false; joinErrorMsg="";
    conn.send({type:"join", from:myPlayerId, name:username||"P?", required:playerCount});
    conn.on("data", (data)=>{
      if(data.type==="gamestate"||data.type==="wordcleared") onGameMsg(data, conn);
      else onLobbyMsg(data, conn);
    });
    conn.on("close", ()=>{
      // Always attempt migration if we lose host connection, regardless of state
      // Mark old host slot as disconnected if mid-game
      if((state==="game"||state==="gameover_multi") && lobby.hostPeerId){
        const hostState = remoteStates[lobby.hostPeerId];
        if(hostState && hostState.slotIdx!==undefined && players[hostState.slotIdx]){
          players[hostState.slotIdx].dead = true;
          players[hostState.slotIdx].disconnected = true;
        }
      }
      // Migrate silently — do NOT change state for gameover_multi or game
      if(state==="lobby_wait"||state==="game"||state==="gameover_multi"){
        attemptHostMigration();
      }
    });
    if(!isMigration) state="lobby_wait";
    sfxPlayerJoin();
  });

  conn.on("error", ()=>{
    clearTimeout(timeout);
    hostConn=null;
    if(retries < 10){
      setTimeout(()=>_doGuestConnect(code, isMigration, retries+1), 300);
    } else if(isMigration && lobby.hostPeerId){
      joinConnecting=false;
      openGuestPeerById(lobby.hostPeerId);
    } else {
      joinConnecting=false;
      joinErrorMsg = isMigration ? "RECONNECT FAILED" : "CANNOT CONNECT!";
      sfxMiss();
    }
  });
}

async function submitJoinCode(){
  const val=joinInput.toUpperCase().trim();
  if(val.length<3){joinErrorMsg="ENTER A CODE!";sfxMiss();return;}
  lobby.code=val; lobby.role="join";
  lobbyPeers={}; myReady=false; lobbyReadyCount=0; countdownActive=false; countdownValue=3;
  resetChat();
  openGuestPeer(val, false);
}

// ── HOST MIGRATION ─────────────────────────────────────────────────────────────────────────────────
// When the host leaves, the host tells guests who the new host is (smallest peerId).
// The elected player opens a host peer on the SAME code. Others reconnect to them.
function attemptHostMigration(){
  if(lobby.hostPeerId) delete lobbyPeers[lobby.hostPeerId];
  const allIds    = [myPlayerId, ...Object.keys(lobbyPeers)].sort();
  const newHostId = allIds[0];
  const code      = lobby.code;

  if(newHostId === myPlayerId){
    // I am the new host.
    // Open peer using MY OWN peerId (guaranteed free, no PeerJS ID collision).
    lobby.role       = "host";
    lobby.hostPeerId = myPlayerId;
    lobby.hostName   = username||"HOST";
    hostConn         = null;
    guestConns       = [];
    myReady          = true;
    lobbyReadyCount  = 1;
    Object.keys(lobbyPeers).forEach(id=>{ if(lobbyPeers[id]) lobbyPeers[id].ready=false; });
    openHostPeer(code);   // try to reclaim the shareable room code first; falls back to myPlayerId automatically if it's still taken
    state = "lobby_wait";
    sfxLobbyReady();
  } else {
    // Someone else is the new host.
    // Connect directly to their peerId (not the room code).
    lobby.role       = "join";
    hostConn         = null;
    lobby.hostPeerId = newHostId;
    lobby.hostName   = lobbyPeers[newHostId]?.name||"HOST";
    lobby.hostReady  = false;
    myReady          = false;
    joinErrorMsg     = "HOST LEFT — RECONNECTING...";
    // Delay so new host peer opens first, then try the shared room code first
    // (the new host is also racing to reclaim it) before falling back to
    // connecting directly to their known player id.
    setTimeout(()=> openGuestPeer(code, true), 1200);
  }
}

// ── LOBBY MESSAGE HANDLER ────────────────────────────────────────────────────────────────────
function onLobbyMsg(data, fromConn){
  const {type,from,name}=data;

  if(type==="welcome"){
    // Full peer list from the host — replace ours entirely
    lobbyPeers={};
    if(data.peers) data.peers.forEach(p=>{
      if(p.id!==myPlayerId) lobbyPeers[p.id]={name:p.name,ready:p.ready||false};
    });
    lobby.hostName   = name||"HOST";
    lobby.hostReady  = data.hostReady||false;
    lobby.hostPeerId = data.hostPeerId||from;
    lobby.hostConnectId = data.hostConnectId||lobby.hostPeerId;
    lobby.code       = data.code||lobby.code;
    if(data.required){ lobby.required=data.required; playerCount=data.required; }
    lobby.players    = Object.keys(lobbyPeers).length+2;
    lobbyReadyCount  = Object.values(lobbyPeers).filter(p=>p.ready).length+(myReady?1:0)+(lobby.hostReady?1:0);
    sfxPlayerJoin();
    state="lobby_wait";

  } else if(type==="join"){
    // Host receives join from a guest
    if(data.required && data.required !== lobby.required){
      if(fromConn){ try{fromConn.send({type:"rejected",reason:"THIS IS A "+(lobby.required===2?"2P":"4P")+" ROOM!"});}catch(e){} }
      return;
    }
    let assignedName = name||from;
    const takenNames = [lobby.hostName||"HOST",
      ...Object.entries(lobbyPeers).filter(([id])=>id!==from).map(([,p])=>p.name)];
    if(takenNames.includes(assignedName)){
      let s=2; while(takenNames.includes(assignedName+"_"+s)) s++; assignedName+="_"+s;
    }
    if(!lobbyPeers[from]) sfxPlayerJoin();
    lobbyPeers[from]={name:assignedName,ready:false,conn:fromConn};
    if(assignedName!==(name||from)){
      if(fromConn){ try{fromConn.send({type:"name_assigned",name:assignedName});}catch(e){} }
    }
    if(fromConn) fromConn._peerId=from;
    lobby.players=Object.keys(lobbyPeers).length+1;
    broadcastLobby({type:"sync_peers", total:lobby.players, hostPeerId:myPlayerId, hostConnectId:myPeer&&myPeer.id,
      peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});

  } else if(type==="rejoin"){
    // Guest is back in the lobby over a connection that never dropped —
    // just reset their ready flag and hand them fresh host state directly
    // (they won't get a fresh "welcome" since no new connection was made).
    if(lobbyPeers[from]){
      lobbyPeers[from].ready=false;
      if(name) lobbyPeers[from].name=name;
    } else if(fromConn){
      lobbyPeers[from]={name:name||from,ready:false,conn:fromConn};
    }
    lobby.players=Object.keys(lobbyPeers).length+1;
    broadcastLobby({type:"sync_peers", total:lobby.players, hostPeerId:myPlayerId, hostConnectId:myPeer&&myPeer.id, hostName:lobby.hostName||username,
      peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});
    if(fromConn){ try{ fromConn.send({type:"host_state", hostReady:myReady, hostName:username||"HOST"}); }catch(e){} }

  } else if(type==="rename"){
    if(lobby.role==="host" && lobbyPeers[from]){
      const takenNames=[lobby.hostName||"HOST",...Object.entries(lobbyPeers).filter(([id])=>id!==from).map(([,p])=>p.name)];
      let assignedName=data.name||from;
      if(takenNames.includes(assignedName)){let s=2;while(takenNames.includes(assignedName+"_"+s))s++;assignedName+="_"+s;}
      lobbyPeers[from].name=assignedName;
      if(assignedName!==(data.name||from)){if(fromConn){try{fromConn.send({type:"name_assigned",name:assignedName});}catch(e){}}}
      broadcastLobby({type:"sync_peers",total:lobby.players,hostPeerId:myPlayerId,hostConnectId:myPeer&&myPeer.id,hostName:lobby.hostName||username,
        peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});
    }

  } else if(type==="sync_peers"){
    const incoming=data.peers||[];
    const prevCount=Object.keys(lobbyPeers).length;
    Object.keys(lobbyPeers).forEach(id=>{ if(!incoming.find(p=>p.id===id)) delete lobbyPeers[id]; });
    incoming.forEach(p=>{ if(p.id!==myPlayerId) lobbyPeers[p.id]={name:p.name,ready:p.ready||false}; });
    if(data.hostPeerId) lobby.hostPeerId=data.hostPeerId;
    if(data.hostConnectId) lobby.hostConnectId=data.hostConnectId;
    if(data.hostName) lobby.hostName=data.hostName;
    lobby.players=data.total||Object.keys(lobbyPeers).length+2;
    lobbyReadyCount=Object.values(lobbyPeers).filter(p=>p.ready).length+(myReady?1:0)+(lobby.hostReady?1:0);
    if(Object.keys(lobbyPeers).length < prevCount) sfxMiss();

  } else if(type==="host_state"){
    // Direct reply to our "rejoin" — we won't get a fresh "welcome" since
    // the connection was reused, so the host hands us its current state here.
    lobby.hostReady = data.hostReady||false;
    if(data.hostName) lobby.hostName = data.hostName;

  } else if(type==="ready"){
    if(lobbyPeers[from]) lobbyPeers[from].ready=data.isReady;
    lobbyReadyCount=Object.values(lobbyPeers).filter(p=>p.ready).length+(myReady?1:0);
    if(data.isReady) sfxPlayerJoin(); else sfxBack();
    if(lobby.role==="host") broadcastLobby({type:"readystate",from,isReady:data.isReady,readyCount:lobbyReadyCount,total:lobby.players});

  } else if(type==="readystate"){
    const who=data.from||from;
    if(lobby.role==="join" && who===lobby.hostPeerId) lobby.hostReady=data.isReady;
    else if(lobbyPeers[who]) lobbyPeers[who].ready=data.isReady;
    if(data.total) lobby.players=data.total;
    lobbyReadyCount=data.readyCount;
    if(data.isReady) sfxPlayerJoin(); else sfxBack();

  } else if(type==="countdown"){
    countdownActive=true; countdownValue=data.value; chatOpen=false;
    if(data.value>0) sfxCountdownBeep();
    else { sfxCountdownGo(); startGame("multi",lobby.required); }

  } else if(type==="countdown_cancel"){
    countdownActive=false; countdownValue=3; sfxMiss();

  } else if(type==="gameseed"){
    multiGameSeed    = data.seed;
    multiGameStartMs = data.startMs;
    lastSpawnTick    = -1;
    if(data.slotOrder){
      const mySlot=data.slotOrder.indexOf(myPlayerId);
      if(mySlot!==-1) localPlayerIdx=mySlot;
    }

  } else if(type==="name_assigned"){
    if(data.name){
      username=data.name;
      joinErrorMsg="NAME TAKEN! You are now: "+data.name;
      setTimeout(()=>{ if(joinErrorMsg.startsWith("NAME TAKEN")) joinErrorMsg=""; },4000);
      sfxMiss();
    }

  } else if(type==="rejected"){
    leaveLobbyChannel();
    state="joingame"; joinInput=""; joinConnecting=false;
    joinErrorMsg=data.reason||"CANNOT JOIN THIS LOBBY";
    sfxMiss();

  } else if(type==="player_disconnected"){
    const dslot=data.slotIdx;
    if(dslot!==undefined && players[dslot] && dslot!==localPlayerIdx){
      players[dslot].dead=true; players[dslot].disconnected=true;
    }
    if(data.peerId){ delete lobbyPeers[data.peerId]; delete remoteStates[data.peerId]; }

  } else if(type==="chat"){
    if(from!==myPlayerId){
      const senderName=(lobby.role==="join"&&from===lobby.hostPeerId)?(lobby.hostName||name||"HOST"):(lobbyPeers[from]?.name||name||"???");
      addChatMessage(senderName, String(data.text||"").slice(0,CHAT_MAX_LEN), false);
    }
    // Host relays chat to every other guest (hub-and-spoke, same as game state)
    if(lobby.role==="host"){
      guestConns.forEach(conn=>{ if(conn!==fromConn){ try{conn.send(data);}catch(e){} } });
    }

  } else if(type==="leave"){
    // Host left — trigger migration immediately
    if(lobby.role==="join" && from===lobby.hostPeerId){
      attemptHostMigration();
      return;
    }
    // A guest left (host receives this)
    if(lobby.role==="host"){
      const leavingSlot=remoteStates[from]?.slotIdx;
      const leavingConn=guestConns.find(c=>c._peerId===from);
      if(leavingConn){ try{leavingConn.close();}catch(e){} }
      guestConns=guestConns.filter(c=>c._peerId!==from);
      delete lobbyPeers[from]; delete remoteStates[from];
      lobby.players=Object.keys(lobbyPeers).length+1;
      lobbyReadyCount=Object.values(lobbyPeers).filter(p=>p.ready).length+(myReady?1:0);
      if(state==="game" && leavingSlot!==undefined && players[leavingSlot]){
        players[leavingSlot].dead=true; players[leavingSlot].disconnected=true;
        broadcastLobby({type:"player_disconnected",slotIdx:leavingSlot,peerId:from});
      }
      broadcastLobby({type:"sync_peers",total:lobby.players,hostPeerId:myPlayerId,hostConnectId:myPeer&&myPeer.id,
        peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});
      if(countdownActive){countdownActive=false;countdownValue=3;if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}broadcastLobby({type:"countdown_cancel"});sfxMiss();}
    } else {
      // Guest sees another guest leave — update local list
      const leavingSlot=remoteStates[from]?.slotIdx;
      delete lobbyPeers[from]; delete remoteStates[from];
      lobby.players=Math.max(1,Object.keys(lobbyPeers).length+2);
      lobbyReadyCount=Object.values(lobbyPeers).filter(p=>p.ready).length+(myReady?1:0)+(lobby.hostReady?1:0);
      if(state==="game" && leavingSlot!==undefined && players[leavingSlot]){
        players[leavingSlot].dead=true; players[leavingSlot].disconnected=true;
      }
      if(countdownActive){countdownActive=false;countdownValue=3;sfxMiss();}
      sfxMiss();
    }
  }
}

function onGameMsg(data, fromConn){
  if(data.type==="wordcleared"){
    // Immediately clear the falling word for that player on this screen
    const slot = data.slotIdx;
    if(slot!==undefined && players[slot] && slot!==localPlayerIdx){
      players[slot].falling = null;
      players[slot].spawnTimer = 0;
      // Sync score/combo too
      if(data.score!==undefined) players[slot].score = data.score;
      if(data.combo!==undefined) players[slot].combo = data.combo;
    }
    // Host relays to other guests
    if(lobby.role==="host"){
      guestConns.forEach(conn=>{
        if(conn!==fromConn){try{conn.send(data);}catch(e){}}
      });
    }
    return;
  }

  if(data.type!=="gamestate") return;
  const senderId=data.from;
  if(!senderId) return;

  // Store this sender's state
  if(!remoteStates[senderId]) remoteStates[senderId]={};
  const rs=remoteStates[senderId];
  rs.score=data.score; rs.combo=data.combo; rs.dead=data.dead;
  rs.typed=data.typed||"";
  if(data.rows!==undefined) rs.rows=data.rows;
  if(data.falling!==undefined) rs.falling=data.falling; // null or {text,col,yRatio,speed}
  if(data.slotIdx!==undefined) rs.slotIdx=data.slotIdx;

  // HOST RELAY: forward this state to all OTHER guests
  if(lobby.role==="host"){
    guestConns.forEach(conn=>{
      if(conn!==fromConn){ try{conn.send(data);}catch(e){} }
    });
  }
}

function sendGameState(){
  if(!isOnlineGame) return;
  const now=Date.now();
  if(now-lastSendTime<SEND_INTERVAL_MS) return;
  lastSendTime=now;
  const me=players[localPlayerIdx];
  if(!me) return;
  const data={
    type:"gamestate", from:myPlayerId,
    score:me.score, combo:me.combo, dead:me.dead,
    typed:me.typed||"",
    name:me.name||"",
    slotIdx:localPlayerIdx,
    rows:me.rows,
  };
  if(lobby.role==="host"){
    guestConns.forEach(conn=>{try{conn.send(data);}catch(e){} });
  } else {
    if(hostConn){try{hostConn.send(data);}catch(e){}}
  }
}

function broadcastLobby(data){guestConns.forEach(c=>{try{c.send(data);}catch(e){} });}
function sendToHost(data){if(hostConn){try{hostConn.send(data);}catch(e){} }}
function sendLobby(data){if(lobby.role==="host") broadcastLobby(data); else sendToHost(data);}
function isOnlineConnected(){return myPeer&&myPeer.open;}

// ── LOBBY HEARTBEAT ───────────────────────────────────────────────────────────
let lobbyHeartbeatTimer = null;
function startLobbyHeartbeat(){
  stopLobbyHeartbeat();
  lobbyHeartbeatTimer = setInterval(()=>{
    if(state!=="lobby_wait" || lobby.role!=="host") { stopLobbyHeartbeat(); return; }
    broadcastLobby({
      type:"sync_peers", total:lobby.players, hostPeerId:myPlayerId, hostConnectId:myPeer&&myPeer.id, hostName:lobby.hostName||username,
      peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready}))
    });
  }, 500);
}
function stopLobbyHeartbeat(){ if(lobbyHeartbeatTimer){clearInterval(lobbyHeartbeatTimer);lobbyHeartbeatTimer=null;} }

function leaveLobbyChannel(){
  try{ sendLobby({type:"leave",from:myPlayerId}); }catch(e){}
  stopLobbyHeartbeat();
  if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}
  countdownActive=false; countdownValue=3; myReady=false; lobbyReadyCount=0;
  const peerToClose=myPeer, hostToClose=hostConn, guestsToClose=[...guestConns];
  hostConn=null; guestConns=[]; lobbyPeers={}; remoteStates={};
  lobby.code=null; lobby.players=0; lobby.role=null; lobby.hostPeerId=null; lobby.hostConnectId=null;
  resetChat();
  setTimeout(()=>{
    if(hostToClose){ try{hostToClose.close();}catch(e){} }
    guestsToClose.forEach(c=>{try{c.close();}catch(e){}});
    if(myPeer===peerToClose){ try{peerToClose.destroy();}catch(e){} myPeer=null; }
    else { try{peerToClose.destroy();}catch(e){} }
  },400);
}

function startCountdown(){
  countdownActive=true; countdownValue=3; sfxCountdownBeep();
  chatOpen=false;
  const guestIds   = Object.keys(lobbyPeers);
  const slotOrder  = [myPlayerId, ...guestIds];
  localPlayerIdx   = 0;
  // Generate seed once — used by host AND sent to guests
  const seed       = Math.floor(Date.now() % 999983);
  const startMs    = Date.now() + 3300; // 3 s countdown + 300ms buffer
  // Set on host immediately
  multiGameSeed    = seed;
  multiGameStartMs = startMs;
  lastSpawnTick    = -1;
  // Broadcast countdown start
  broadcastLobby({type:"countdown", value:3, diff:"multi"});
  // Send seed + slot order to all guests so they use identical values
  broadcastLobby({type:"gameseed", seed, startMs, slotOrder});
  countdownInterval = setInterval(()=>{
    countdownValue--;
    if(countdownValue>0){
      sfxCountdownBeep();
      broadcastLobby({type:"countdown", value:countdownValue, diff:"multi"});
    } else {
      clearInterval(countdownInterval); countdownInterval=null; sfxCountdownGo();
      broadcastLobby({type:"countdown", value:0, diff:"multi"});
      setTimeout(()=>startGame("multi", lobby.required), 200);
    }
  }, 1000);
}

// ── REMATCH VOTING ────────────────────────────────────────────────────────────
let myRematchVote  = null;   // null=not voted, true=play again, false=menu
let rematchVotes   = {};     // { peerId: true/false }
let rematchTimeout = null;
let rematchTimeLeft = 15;    // seconds remaining shown on screen
let rematchTickInterval = null;
const REMATCH_TIMEOUT_MS = 15000;

function initRematch(){
  myRematchVote  = null;
  rematchVotes   = {};
  rematchTimeLeft = 15;
  if(rematchTimeout) clearTimeout(rematchTimeout);
  if(rematchTickInterval) clearInterval(rematchTickInterval);
  // Tick down the countdown display every second
  rematchTickInterval = setInterval(()=>{
    rematchTimeLeft = Math.max(0, rematchTimeLeft - 1);
  }, 1000);
  // Auto-go-to-menu after 15s
  rematchTimeout = setTimeout(()=>{
    if(rematchTickInterval){ clearInterval(rematchTickInterval); rematchTickInterval=null; }
    if(state!=="gameover_multi"||myRematchVote!==null) return;
    // Time's up — go to menu
    myRematchVote = false;
    leaveLobbyChannel(); state="menu"; resetAll(); startBGM("menu");
  }, REMATCH_TIMEOUT_MS);
}

function castRematchVote(playAgain){
  if(myRematchVote!==null) return;
  myRematchVote = playAgain;
  if(rematchTimeout){ clearTimeout(rematchTimeout); rematchTimeout=null; }
  if(rematchTickInterval){ clearInterval(rematchTickInterval); rematchTickInterval=null; }

  if(!playAgain){
    // MENU — fully disconnect immediately, same as 2P
    leaveLobbyChannel(); state="menu"; resetAll(); startBGM("menu");
    return;
  }

  // PLAY AGAIN — go straight to lobby, same as 2P
  // No voting system — each player decides independently
  returnToLobby();
}

// ── RETURN TO LOBBY (Play Again) ────────────────────────────────────────────────────────────
function returnToLobby(){
  myReady=(lobby.role==="host"); lobbyReadyCount=myReady?1:0;
  countdownActive=false; countdownValue=3;
  if(countdownInterval){ clearInterval(countdownInterval); countdownInterval=null; }
  Object.keys(lobbyPeers).forEach(id=>{ if(lobbyPeers[id]) lobbyPeers[id].ready=false; });
  if(lobby.role==="join") lobby.hostReady=false;
  lobby.players=Object.keys(lobbyPeers).length+1;
  state="lobby_wait"; startBGM("menu");

  if(lobby.role==="host" && lobby.code){
    // Keep existing peer open (don't destroy — guests may still be connecting).
    // Just restart heartbeat and sync state.
    if(!myPeer || !myPeer.open) openHostPeer(lobby.code);
    broadcastLobby({type:"sync_peers",total:lobby.players,hostPeerId:myPlayerId,hostConnectId:myPeer&&myPeer.id,
      peers:Object.entries(lobbyPeers).map(([id,p])=>({id,name:p.name,ready:p.ready||false}))});
    // Existing guests already have an open connection (no fresh "welcome" incoming) —
    // tell them directly that the host is auto-ready again.
    broadcastLobby({type:"readystate",from:myPlayerId,isReady:myReady,readyCount:lobbyReadyCount,total:lobby.players});
    startLobbyHeartbeat();
  } else if(lobby.role==="join"){
    if(hostConn && hostConn.open){
      // Connection to host never actually dropped — reuse it instead of
      // tearing it down and racing a brand-new WebRTC handshake.
      sendToHost({type:"rejoin", from:myPlayerId, name:username||"P?"});
    } else if(lobby.hostConnectId){
      // Truly disconnected — reconnect directly to the host's REAL live
      // PeerJS connect ID (hostConnectId — always accurate for both
      // original and migrated hosts).
      openGuestPeerById(lobby.hostConnectId);
    } else if(lobby.code){
      openGuestPeer(lobby.code, false);
    }

// ── PLAYER STATE ──────────────────────────────────────────────────────────────
function makePlayerState(id,color,name){
  return {id,color,name,rows:[],falling:null,typed:"",score:0,combo:0,
    lastEscDanger:-1,escFlashTimer:0,escFlashLabel:"",
    spawnTimer:0,particles:[],dead:false,pendingSpawn:null,landingFlash:null};
}
let players=[];
let lastStanding=null,lastStandingTimer=0;

// ── MULTI SPAWN COORDINATOR ────────────────────────────────────────────────────
let multiGameSeed=0,multiGameStartMs=0,lastSpawnTick=-1;
let multiSpawnInterval=130,multiRoundScore=0,multiCurrentLength=3;

function tickMultiSpawnCoordinator(){
  if(!multiGameStartMs||Date.now()<multiGameStartMs) return;
  const elapsed=Date.now()-multiGameStartMs;
  const alive=players.filter(p=>!p.dead);
  if(alive.length>0) multiRoundScore=alive.reduce((s,p)=>s+p.score,0)/alive.length;
  multiSpawnInterval=Math.max(45,130-multiRoundScore*0.25);
  const intervalMs=(multiSpawnInterval/60)*1000;
  const currentTick=Math.floor(elapsed/intervalMs);
  if(currentTick<=lastSpawnTick) return;
  lastSpawnTick=currentTick;
  const lenSeed=multiGameSeed*1000+currentTick*7919;
  const sharedLength=pickLengthFromSeed(lenSeed,multiRoundScore);
  multiCurrentLength=sharedLength;
  const speedSeed=multiGameSeed*1000+currentTick*7919+99999;
  const esc=getEscalation(multiRoundScore);
  const sharedSpeed=(MULTI_CFG.baseSpeed+seededRand(speedSeed)*MULTI_CFG.rand)*esc.mult;
  const colSeed=multiGameSeed*1000+currentTick*7919+55555;
  const sharedCol=Math.floor(seededRand(colSeed)*4);
  // Assign to ALL non-dead players — including opponents on this browser
  // Every browser runs this same code with the same seed → same word/col/speed
  // for each player slot, so the opponent pane is always in sync visually.
  players.forEach((p)=>{
    if(p.dead) return;
    if(p.falling) return; // already has a word in flight
    const activeSet = new Set(p.rows.map(r=>r.text));
    const wordSeed  = multiGameSeed*1000 + currentTick*7919 + 33331 + p.id*997;
    const wordText  = getMultiWord(sharedLength, activeSet, wordSeed);
    const fallback_x = 40 + sharedCol * 60;
    p.falling = {text:wordText, col:sharedCol, yRatio:0, speed:sharedSpeed, x:fallback_x, y:0};
    p.spawnTimer = 0;
  });
}
function pickLengthFromSeed(seed,avgScore){
  const r=seededRand(seed);
  let options;
  if(avgScore<30) options=[3,3,3,4,4]; else if(avgScore<70) options=[3,4,4,4,5];
  else if(avgScore<130) options=[4,4,5,5,6]; else if(avgScore<210) options=[5,6,6,7,8];
  else if(avgScore<320) options=[6,7,8,9,10]; else options=[8,9,10,11,12,13];
  const valid=options.filter(l=>WORDS_BY_LENGTH[l]);
  if(!valid.length) return AVAILABLE_LENGTHS[Math.floor(r*AVAILABLE_LENGTHS.length)];
  return valid[Math.floor(r*valid.length)];
}
function getMultiWord(targetLength, activeSet, playerSeed){
  const candidates = WORDS_BY_LENGTH[targetLength]||[];
  const available  = candidates.filter(w=>!activeSet.has(w));
  const pool       = available.length>0 ? available : candidates;
  if(pool.length===0){
    const fb = WORDS_MULTI.filter(({w})=>!activeSet.has(w)&&Math.abs(w.length-targetLength)<=2);
    const src = fb.length>0 ? fb : WORDS_MULTI;
    return src[Math.floor(seededRand(playerSeed)*src.length)].w||src[0].w;
  }
  return pool[Math.floor(seededRand(playerSeed)*pool.length)];
}

// ── SINGLE PLAYER STATE ───────────────────────────────────────────────────────
let singleRows=[],singleFalling=null,singleTyped="",singleScore=0,singleCombo=0;
let singleLastEscDanger=-1,singleEscFlashTimer=0,singleEscFlashLabel="";
let singleSpawnTimer=0,singleParticles=[];
let singleTotalKeys=0,singleCorrectWords=0,singleWrongSubmits=0;
let singleNextWord=null,singleGameStartTime=0,singlePausedMs=0,singlePauseStartTime=0;

function pickNextWord(){
  const word=drawWord(difficulty||"easy");
  const col=Math.floor(Math.random()*COLS.length);
  // Make sure the word isn't currently on screen
  const active=new Set();
  if(singleFalling) active.add(singleFalling.text);
  singleRows.forEach(r=>active.add(r.text));
  // If drawn word is already on screen, try once more from pool
  let finalWord=word;
  if(active.has(word)){
    const alt=drawWord(difficulty||"easy");
    finalWord=active.has(alt)?word:alt; // if alt also on screen just use original
  }
  return{text:finalWord,col,x:COLS[col]};
}

// ── START / RESET ─────────────────────────────────────────────────────────────
function startGame(diff,numPlayers){
  state="game"; difficulty=diff; playerCount=numPlayers||1; paused=false;
  isOnlineGame=(numPlayers>1&&isOnlineConnected());
  if(!isOnlineGame){localPlayerIdx=0;lobby.code=null;lobby.players=0;lobby.role=null;}
  if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}
  countdownActive=false; countdownValue=3;
  initWordPool(diff); // fresh shuffled pool, no repeats
  resetAll();
  startBGM("game");
}
function resetAll(){
  gameSessionId++;
  singleRows=[]; singleFalling=null; singleTyped=""; singleScore=0; singleCombo=0;
  singleLastEscDanger=-1; singleEscFlashTimer=0; singleSpawnTimer=0; singleParticles=[];
  singleTotalKeys=0; singleCorrectWords=0; singleWrongSubmits=0;
  singleGameStartTime=Date.now(); singlePausedMs=0; singlePauseStartTime=0;
  singleNextWord=difficulty?pickNextWord():null;
  players=[];
  for(let i=0;i<playerCount;i++){
    // For online games: slot 0 is always the host.
    // Use lobby.hostName for slot 0 unless we ARE the host (localPlayerIdx===0).
    let pname;
    if(isOnlineGame && i===0 && localPlayerIdx!==0){
      pname=lobby.hostName||"HOST";
    } else if(i===localPlayerIdx && username){
      pname=username;
    } else {
      pname=PLAYER_NAMES[i];
    }
    players.push(makePlayerState(i,PLAYER_COLORS[i],pname));
  }
  lastStanding=null; lastStandingTimer=0; multiForfeitConfirm=false; spectatorMode=false;
  myRematchVote=null; rematchVotes={};
  if(rematchTimeout){ clearTimeout(rematchTimeout); rematchTimeout=null; }
  multiSpawnInterval=130; multiRoundScore=0; multiCurrentLength=3; lastSpawnTick=-1;
  lastSendTime=0;
  // Apply names from lobby for remaining slots
  if(isOnlineGame){
    players[localPlayerIdx].name=username?username:PLAYER_NAMES[localPlayerIdx];
    const guestList=Object.entries(lobbyPeers);
    guestList.forEach(([pid,peer],i)=>{
      const slot=i+(localPlayerIdx===0?1:0);
      if(players[slot]) players[slot].name=peer.name||"P?";
      if(!remoteStates[pid]) remoteStates[pid]={};
      remoteStates[pid].slotIdx=slot;
    });
  }
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
function singleSubmit(){
  const val=singleTyped.toUpperCase();
  if(singleFalling&&val===singleFalling.text){
    const cfg=DIFF_CFG[difficulty]||DIFF_CFG.easy,esc=getEscalation(singleScore);
    const pts=Math.round(cfg.pts*(1+singleCombo*0.1)*(1+esc.danger*0.2));
    singleScore+=pts; singleCombo++; singleCorrectWords++;
    spawnParticles(singleParticles,singleFalling.x+40,singleFalling.y,C.teal,10);
    singleCombo>2?sfxCombo():sfxDestroy(); singleFalling=null; singleSpawnTimer=0; singleTyped=""; return;
  }
  const i=singleRows.findIndex(r=>r.text===val);
  if(i!==-1){
    const cfg=DIFF_CFG[difficulty]||DIFF_CFG.easy,esc=getEscalation(singleScore);
    const pts=Math.round(cfg.pts*(1+singleCombo*0.1)*(1+esc.danger*0.2));
    singleScore+=pts; singleCombo++; singleCorrectWords++;
    spawnParticles(singleParticles,COLS[singleRows[i].col]+40,BOTTOM-i*ROW_H,C.green,8);
    singleRows.splice(i,1); singleCombo>2?sfxCombo():sfxDestroy();
  } else { singleCombo=0; singleWrongSubmits++; sfxMiss(); }
  singleTyped="";
}
function multiSubmit(p){
  const val=p.typed.toUpperCase();
  if(p.falling&&val===p.falling.text){
    const esc=getEscalation(p.score),pts=getMultiPts(val,p.combo,esc.danger);
    p.score+=pts; p.combo++;
    spawnParticles(p.particles,p.falling.x??40,p.falling.y??40,p.color,10);
    p.combo>2?sfxCombo():sfxDestroy();
    p.falling=null; p.spawnTimer=0; p.typed="";
    // Instantly notify all peers to clear this word from their screens
    sendWordCleared(p);
    return;
  }
  const i=p.rows.findIndex(r=>r.text===val);
  if(i!==-1){
    const esc=getEscalation(p.score),pts=getMultiPts(val,p.combo,esc.danger);
    p.score+=pts; p.combo++; p.rows.splice(i,1); p.combo>2?sfxCombo():sfxDestroy();
    spawnParticles(p.particles,p.falling?(p.falling.x??40):40,300,p.color,8);
  } else { p.combo=0; sfxMiss(); }
  p.typed="";
}

function sendWordCleared(p){
  if(!isOnlineGame) return;
  const msg={
    type:"wordcleared",
    from:myPlayerId,
    slotIdx:localPlayerIdx,
    score:p.score,
    combo:p.combo,
  };
  if(lobby.role==="host") guestConns.forEach(c=>{try{c.send(msg);}catch(e){}});
  else if(hostConn){try{hostConn.send(msg);}catch(e){}}
}

    if(e.key==="Backspace") singleTyped=singleTyped.slice(0,-1);
    else if(e.key==="Enter") singleSubmit();
    else if(/^[a-zA-Z]$/.test(e.key)){singleTyped+=e.key.toUpperCase();singleTotalKeys++;sfxType();}
  } else {
    // Block all input if local player is dead (spectator mode)
    const p=players[localPlayerIdx];
    if(!p||p.dead) return;
    if(e.key==="Escape"){
      multiForfeitConfirm=!multiForfeitConfirm;
      if(multiForfeitConfirm) bgmGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.15);
      else bgmGain.gain.linearRampToValueAtTime(soundEnabled?0.18:0,audioCtx.currentTime+0.15);
      sfxClick();return;
    }
    if(multiForfeitConfirm) return;
    if(e.key==="Backspace") p.typed=p.typed.slice(0,-1);
    else if(e.key==="Enter") multiSubmit(p);
    else if(/^[a-zA-Z]$/.test(e.key)){p.typed+=e.key.toUpperCase();sfxType();}
  }
});

// ── BACKGROUND ────────────────────────────────────────────────────────────────
function bg(){
  frameN++; const t=Date.now()*0.002;
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,C.bg1); g.addColorStop(1,C.bg2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=C.grid; ctx.lineWidth=1;
  for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let i=0;i<40;i++){const x=(i*40+Math.sin(t+i)*20)%W,y=TOP+(i*30+Math.cos(t+i)*30)%(BOTTOM-TOP);ctx.fillStyle=C.dot;ctx.fillRect(x-1,y-1,3,3);}
  scanY=(scanY+1)%H; ctx.fillStyle=C.scan; ctx.fillRect(0,scanY,W,3);
}

// ── DRAW PANE ─────────────────────────────────────────────────────────────────
// Used for BOTH the local player's main pane and opponents' mini panes.
// px,py,pw,ph = bounding box on canvas
// isLocal: true = physics run here; false = animate from network state
function drawPane(p, px, py, pw, ph, isLocal, noHeader=false){
  const isNarrow=pw<180;
  const headerH=noHeader?0:(isNarrow?24:36);
  const inputH=noHeader?0:(isNarrow?28:44);
  const PLAY_H=ph-headerH-inputH;
  const pTop=py+headerH, pBottom=py+ph-inputH;
  const nCols=4;
  const colStep=Math.floor((pw-16)/nCols);
  const pCols=Array.from({length:nCols},(_,i)=>8+i*colStep);
  const pRowH=isNarrow?20:30;
  const esc=getEscalation(p.score);

  ctx.save();
  // Inset clip by 2px so glow/shadow can never bleed past the panel border
  ctx.beginPath(); ctx.rect(px+2,py+2,pw-4,ph-4); ctx.clip();

  // Background
  ctx.fillStyle=`rgba(3,3,14,${isNarrow?0.75:0.82})`;
  ctx.fillRect(px,py,pw,ph);

  // Colour glow border
  ctx.strokeStyle=`rgba(${hexRgb(p.color)},${isNarrow?0.55:0.30})`;
  ctx.lineWidth=isNarrow?1.5:1;
  ctx.strokeRect(px+1,py+1,pw-2,ph-2);

  // Danger overlay
  if(esc.danger>=3){const pulse=0.04+0.04*Math.sin(Date.now()*0.008);ctx.fillStyle=`rgba(255,20,50,${pulse})`;ctx.fillRect(px,py,pw,ph);}
  else if(esc.danger>=2){const pulse=0.02+0.02*Math.sin(Date.now()*0.005);ctx.fillStyle=`rgba(255,120,0,${pulse})`;ctx.fillRect(px,py,pw,ph);}

  // Escalation detection (local only)
  if(isLocal&&esc.danger>p.lastEscDanger){p.lastEscDanger=esc.danger;p.escFlashTimer=90;p.escFlashLabel=esc.label;sfxCombo();}

  // ── PHYSICS ──────────────────────────────────────────────────────────────
  if(p.falling){
    // Bug12: advance yRatio relative to this pane's PLAY_H so visual speed
    // is identical whether pane is large (main) or small (mini)
    p.falling.yRatio = (p.falling.yRatio||0) + p.falling.speed / PLAY_H;
    const limitRatio = Math.max(0, (PLAY_H - p.rows.length*pRowH) / PLAY_H);
    if(p.falling.yRatio >= limitRatio){
      if(isLocal){
        p.rows.push({text:p.falling.text, col:p.falling.col}); sfxLand();
        spawnParticles(p.particles, px+pCols[p.falling.col%nCols]+10, pTop+limitRatio*PLAY_H, C.amber, 5);
        p.landingFlash = {text:p.falling.text, col:p.falling.col, yRatio:limitRatio, timer:8};
        const maxRows = Math.max(3, Math.floor((PLAY_H-10)/pRowH));
        if(p.rows.length > maxRows) p.dead = true;
      }
      p.falling = p.pendingSpawn||null; p.pendingSpawn=null; p.spawnTimer=0;
    }
  }

  // ── DRAW ROWS ─────────────────────────────────────────────────────────────
  for(let i=0;i<p.rows.length;i++){
    const r=p.rows[i];
    const fontSize=isNarrow?7:10;
    ctx.font=`${fontSize}px ${PX}`; const tw=ctx.measureText(r.text).width;
    // Clamp wx so word box stays fully inside panel (4px margin each side)
    const wxRaw=px+pCols[r.col%nCols];
    const wx=Math.min(wxRaw, px+pw-tw-10);
    const wy=pBottom-i*pRowH;
    const dangerRatio=p.rows.length/12;
    const rowClr=dangerRatio>0.7?C.red:dangerRatio>0.4?C.amber:C.green;
    ctx.fillStyle=`rgba(0,180,120,${0.05+dangerRatio*0.1})`; ctx.fillRect(wx-3,wy-fontSize-2,tw+6,fontSize+6);
    ctx.strokeStyle=`rgba(${dangerRatio>0.7?"255,60,80":dangerRatio>0.4?"255,180,0":"0,230,150"},0.4)`;
    ctx.lineWidth=1; ctx.strokeRect(wx-3,wy-fontSize-2,tw+6,fontSize+6);
    pxDraw(r.text,wx,wy,rowClr,fontSize,false);
  }

  // ── DRAW FALLING WORD ─────────────────────────────────────────────────────
  if(p.falling){
    const fyPx=pTop+(p.falling.yRatio||0)*PLAY_H;
    const fontSize=isNarrow?8:11;
    ctx.font=`${fontSize}px ${PX}`; const tw=ctx.measureText(p.falling.text).width;
    // Clamp fx so falling word stays fully inside panel (4px margin each side)
    const fxRaw=px+pCols[p.falling.col%nCols];
    const fx=Math.min(fxRaw, px+pw-tw-10);
    p.falling.x=fx; p.falling.y=fyPx; // for particle spawning
    const len=p.falling.text.length;
    const wordClr=len<=3?C.green:len<=5?C.teal:len<=8?C.amber:C.red;
    ctx.fillStyle="rgba(0,180,255,0.10)"; ctx.fillRect(fx-3,fyPx-fontSize-2,tw+6,fontSize+6);
    ctx.strokeStyle="rgba(0,200,255,0.45)"; ctx.lineWidth=1; ctx.strokeRect(fx-3,fyPx-fontSize-2,tw+6,fontSize+6);
    pxDraw(p.falling.text,fx,fyPx,wordClr,fontSize,false);
    // Length badge (mini only)
    if(isNarrow){
      const ls=`${p.falling.text.length}`;
      ctx.font=`5px ${PX}`; const lbw=ctx.measureText(ls).width;
      ctx.fillStyle=`rgba(${hexRgb(wordClr)},0.85)`; ctx.fillRect(fx+tw+3,fyPx-fontSize-2,lbw+3,8);
      ctx.fillStyle="#000"; ctx.fillText(ls,fx+tw+5,fyPx-fontSize+3);
    }
  }

  // ── LANDING FLASH ─────────────────────────────────────────────────────────
  if(p.landingFlash){
    if(!p.dead) p.landingFlash.timer--;
    if(p.landingFlash.timer<=0){ p.landingFlash=null; }
    else{
      const lf=p.landingFlash,fyPx=pTop+lf.yRatio*PLAY_H;
      const fontSize=isNarrow?8:11;
      ctx.globalAlpha=(lf.timer/8)*0.7; ctx.font=`${fontSize}px ${PX}`;
      const tw=ctx.measureText(lf.text).width;
      const fxRaw=px+pCols[lf.col%nCols];
      const fx=Math.min(fxRaw, px+pw-tw-10);
      ctx.fillStyle="#ffffff"; ctx.fillRect(fx-3,fyPx-fontSize-2,tw+6,fontSize+6);
      ctx.globalAlpha=1;
    }
  }

  // ── PARTICLES ─────────────────────────────────────────────────────────────
  for(let i=p.particles.length-1;i>=0;i--){
    const pt=p.particles[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life-=0.04;
    if(pt.life<=0){p.particles.splice(i,1);continue;}
    ctx.globalAlpha=pt.life; ctx.fillStyle=pt.color; ctx.fillRect(pt.x,pt.y,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  // ── HEADER ────────────────────────────────────────────────────────────────
  ctx.fillStyle="rgba(3,3,18,0.94)"; ctx.fillRect(px,py,pw,headerH);
  ctx.fillStyle=p.color; ctx.fillRect(px,py+headerH-2,pw,2);
  const nameFontSz=isNarrow?5:7;
  ctx.font=`${nameFontSz}px ${PX}`;
  const dispName=isNarrow&&p.name.length>6?p.name.slice(0,6):p.name;
  const nw=ctx.measureText(dispName).width;
  // ── HEADER BAR ────────────────────────────────────────────────────────────
  if(!noHeader){
    ctx.fillStyle="rgba(3,3,18,0.94)"; ctx.fillRect(px,py,pw,headerH);
    ctx.fillStyle=p.dead?`rgba(${hexRgb(p.color)},0.3)`:p.color;
    ctx.fillRect(px,py+headerH-2,pw,2);
    ctx.font=`${isNarrow?6:7}px ${PX}`;
    const dispName=p.name||(isLocal?"YOU":"???");
    const nw=ctx.measureText(dispName).width;
    ctx.shadowColor=p.color; ctx.shadowBlur=6; ctx.fillStyle=p.color;
    ctx.fillText(dispName,px+pw/2-nw/2,py+headerH-6); ctx.shadowBlur=0;
    if(!isNarrow){
      pxDraw(`${p.score}`,px+5,py+headerH-6,C.amber,7,false);
      if(p.combo>1){const cs=`x${p.combo}`;ctx.font=`6px ${PX}`;const cw2=ctx.measureText(cs).width;pxDraw(cs,px+pw-cw2-5,py+headerH-6,p.combo>=5?C.amber:C.green,6,false);}
    } else {
      ctx.font=`5px ${PX}`; ctx.fillStyle=C.amber; ctx.fillText(`${p.score}`,px+3,py+headerH-5);
    }
  }

  // Active pulse border
  if(isLocal){
    const ta=Date.now()*0.006,alpha=0.4+0.35*Math.sin(ta);
    ctx.strokeStyle=`rgba(${hexRgb(p.color)},${alpha.toFixed(2)})`;
    ctx.lineWidth=2; ctx.strokeRect(px+1,py+1,pw-2,ph-2);
  }

  // ── INPUT BAR ─────────────────────────────────────────────────────────────
  if(!noHeader){
    ctx.fillStyle="rgba(3,3,18,0.95)"; ctx.fillRect(px,py+ph-inputH,pw,inputH);
    ctx.fillStyle=p.color; ctx.fillRect(px,py+ph-inputH,pw,2);
    if(isLocal&&!p.dead){
      const cursor=Math.floor(Date.now()/400)%2===0?"_":" ";
      const display=p.typed+cursor;
      const inputFontSz=isNarrow?7:9;
      ctx.font=`${inputFontSz}px ${PX}`; const itw=ctx.measureText(display).width;
      pxDraw(display,px+pw/2-itw/2,py+ph-inputH/2+4,p.color,inputFontSz,true);
    } else if(!isLocal){
      const remTyped=p.typed||"";
      const dotLabel=remTyped.length>0?(isNarrow?remTyped.slice(-4):remTyped):"●";
      const inputFontSz=isNarrow?6:7;
      ctx.font=`${inputFontSz}px ${PX}`; const dlw=ctx.measureText(dotLabel).width;
      ctx.shadowColor=C.green; ctx.shadowBlur=Math.floor(Date.now()/400)%2===0?5:0;
      ctx.fillStyle=remTyped.length>0?p.color:C.green;
      ctx.fillText(dotLabel,px+pw/2-dlw/2,py+ph-inputH/2+4); ctx.shadowBlur=0;
    }
  }

  // ── DEAD OVERLAY ──────────────────────────────────────────────────────────
  if(p.dead&&!noHeader){
    ctx.fillStyle="rgba(0,0,0,0.72)"; ctx.fillRect(px,py,pw,ph);
    const dtxt=isNarrow?"OUT":"ELIMINATED";
    ctx.font=`${isNarrow?8:9}px ${PX}`; const dw=ctx.measureText(dtxt).width;
    pxDraw(dtxt,px+pw/2-dw/2,py+ph/2,C.red,isNarrow?8:9,true);
    ctx.font=`${isNarrow?6:7}px ${PX}`; const stxt=`${p.score}`;
    const sw=ctx.measureText(stxt).width;
    pxDraw(stxt,px+pw/2-sw/2,py+ph/2+16,C.amber,isNarrow?6:7,false);
  }

  // ── LAST STANDING BANNER ──────────────────────────────────────────────────
  if(lastStanding&&lastStanding===p&&!p.dead&&isLocal){
    const alpha=Math.min(1,(180-lastStandingTimer)/30);
    ctx.globalAlpha=alpha*(0.7+0.3*Math.sin(Date.now()*0.006));
    ctx.font=`9px ${PX}`; const bt="★ LAST STANDING ★"; const bw=ctx.measureText(bt).width;
    ctx.fillStyle=C.amber; ctx.shadowColor=C.amber; ctx.shadowBlur=12;
    ctx.fillText(bt,px+pw/2-bw/2,py+headerH+20); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Esc flash
  if(isLocal&&p.escFlashTimer>0){
    p.escFlashTimer--;
    const alpha=Math.min(1,p.escFlashTimer/20);
    const flashClr=esc.danger>=3?"#ff2244":esc.danger>=2?"#ffaa00":p.color;
    ctx.globalAlpha=alpha; ctx.font=`11px ${PX}`; const fw=ctx.measureText(p.escFlashLabel).width;
    pxDraw(p.escFlashLabel,px+pw/2-fw/2,py+ph/2,flashClr,11,true); ctx.globalAlpha=1;
  }

  ctx.restore();
}

// ── APPLY REMOTE STATES TO PLAYERS ARRAY ─────────────────────────────────────
// Syncs score, combo, dead, rows, typed from network.
// falling is NOT synced — deterministic coordinator runs on every browser,
// so all panes already show the same falling word at the same position.
function applyRemoteStates(){
  Object.entries(remoteStates).forEach(([pid,rs])=>{
    const slot=rs.slotIdx;
    if(slot===undefined||slot===localPlayerIdx||!players[slot]) return;
    const p=players[slot];
    const hostFallback = (slot===0 && lobby.hostName) ? lobby.hostName : PLAYER_NAMES[slot];
    p.name=rs.name||(lobbyPeers[pid]?.name)||hostFallback;
    p.score=rs.score||0; p.combo=rs.combo||0; p.dead=rs.dead||false;
    p.typed=rs.typed||"";
    // Sync rows from network — but NEVER touch p.falling:
    // the coordinator assigns it deterministically on every browser independently
    if(rs.rows!==undefined) p.rows=rs.rows;
  });
}

function drawSpectatorMode(){
  const alive = players.filter(p=>!p.dead);
  const GAP   = 3;
  const HDR   = 28;
  const t0    = Date.now() * 0.003;

  // Header bar - SPECTATOR label
  ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0,0,W,HDR+6);
  ctx.fillStyle = "#1a1a00"; ctx.fillRect(0,HDR+6,W,2);
  ctx.strokeStyle = C.amber; ctx.lineWidth=1; ctx.strokeRect(0,0,W,HDR+6);
  const specTxt = "👁  SPECTATING"; ctx.font=`8px ${PX}`;
  const stw = ctx.measureText(specTxt).width;
  ctx.shadowColor=C.amber; ctx.shadowBlur=8; ctx.fillStyle=C.amber;
  ctx.fillText(specTxt, W/2-stw/2, HDR);  ctx.shadowBlur=0;
  // Show "YOU ELIMINATED" on right
  ctx.font=`7px ${PX}`; const me=players[localPlayerIdx];
  const elimTxt=`${me?me.name:"YOU"} ELIMINATED · ${me?me.score:0}pts`;
  const etw=ctx.measureText(elimTxt).width;
  ctx.fillStyle="#664400"; ctx.fillText(elimTxt, W-etw-8, HDR);

  if(alive.length===0){
    centered("ALL ELIMINATED",H/2,C.red,16,true);
    return;
  }

  // Draw alive players equally across full width below header
  const topY    = HDR + 8;
  const panelH  = H - topY;
  const panelW  = Math.floor((W - GAP*(alive.length-1)) / alive.length);

  alive.forEach((p, i)=>{
    const fx = i*(panelW+GAP);
    const pi = players.indexOf(p);
    const clr = p.color;
    const pulse = 0.7+0.3*Math.sin(t0+i*0.9);

    // Panel background
    ctx.fillStyle="#07071e"; ctx.fillRect(fx, topY, panelW, panelH);
    // Top accent
    ctx.fillStyle=`rgba(${hexRgb(clr)},${pulse.toFixed(2)})`; ctx.fillRect(fx, topY, panelW, 4);
    // Header strip
    ctx.fillStyle=`rgba(${hexRgb(clr)},0.18)`; ctx.fillRect(fx, topY+4, panelW, HDR);
    ctx.fillStyle=`rgba(${hexRgb(clr)},0.6)`; ctx.fillRect(fx, topY+4+HDR-2, panelW, 2);
    // Name
    ctx.font=`8px ${PX}`; const nm=p.name||`P${pi+1}`;
    const nmw=ctx.measureText(nm).width;
    ctx.shadowColor=clr; ctx.shadowBlur=8; ctx.fillStyle=clr;
    ctx.fillText(nm, fx+(panelW-nmw)/2, topY+4+HDR-8); ctx.shadowBlur=0;
    // Score
    ctx.font=`6px ${PX}`; const sc=`${p.score}`;
    const scw=ctx.measureText(sc).width;
    ctx.fillStyle=C.amber; ctx.fillText(sc, fx+panelW-scw-6, topY+4+HDR-8);
    // "LAST STANDING" badge if only 1 alive
    if(alive.length===1){
      const ls="★ LAST STANDING ★"; const lsw=ctx.measureText(ls).width;
      ctx.shadowColor=C.amber;ctx.shadowBlur=10;ctx.fillStyle=C.amber;
      ctx.fillText(ls,fx+(panelW-lsw)/2,topY+4+HDR+16);ctx.shadowBlur=0;
    }

    // Draw game content clipped
    const contentY=topY+4+HDR;
    const contentH=panelH-4-HDR;
    ctx.save(); ctx.beginPath(); ctx.rect(fx, contentY, panelW, contentH); ctx.clip();
    drawPane(p, fx, contentY, panelW, contentH, false, true);
    ctx.restore();

    // Divider
    if(i < alive.length-1){
      ctx.fillStyle="#08081a"; ctx.fillRect(fx+panelW, topY, GAP, panelH);
      ctx.fillStyle=`rgba(${hexRgb(clr)},0.3)`; ctx.fillRect(fx+panelW+1, topY, 1, panelH);
    }
  });

  // Spectator watermark at bottom
  const t2=Date.now()*0.003;
  const sAlpha=0.2+0.15*Math.sin(t2);
  ctx.globalAlpha=sAlpha; ctx.font=`7px ${PX}`;
  const wt="SPECTATOR MODE — WATCHING REMAINING PLAYERS";
  const wtw=ctx.measureText(wt).width;
  ctx.fillStyle=C.amber; ctx.fillText(wt,W/2-wtw/2,H-8);
  ctx.globalAlpha=1;
}

// ── GAME SCREENS ──────────────────────────────────────────────────────────────
function game4P(){
  tickMultiSpawnCoordinator();
  applyRemoteStates();
  sendGameState();

  const me = players[localPlayerIdx];

  // ── SPECTATOR MODE: local player dead in 4P ────────────────────────────────
  if(me && me.dead){
    if(!spectatorMode){ spectatorMode=true; }
    drawSpectatorMode();
    checkMultiGameOver();
    drawMultiForfeitOverlay();
    return;
  }
  spectatorMode = false;

  const t0 = Date.now() * 0.003;

  // ── Layout: Tetris 99 style — main board LEFT (biggest), 3 opponent
  // boards as narrow FULL-HEIGHT columns side by side on the right.
  // Each opponent column: name up top, thin status bar, full board
  // (never cropped — drawPane scales to whatever size it's given),
  // and a colored score badge at the very bottom.
  const GAP        = 4;
  const HDR_ME     = 28;   // header height for the main (local) panel
  const HDR_MINI   = 18;   // compact header for opponent columns
  const FOOT_MINI  = 30;   // colored score-badge footer height for opponents
  const ME_FRAC    = 0.40; // main panel fraction of total width
  const ME_W       = Math.round(W * ME_FRAC) - GAP;
  const OPP_W      = Math.floor((W - ME_W - GAP * 3) / 3);

  // Build display order: local player first (main), then 3 opponents (side columns)
  const opponents = [0,1,2,3].filter(i => i !== localPlayerIdx);
  const displayOrder = [localPlayerIdx, ...opponents]; // [me, opp0, opp1, opp2]

  // Per-panel geometry: {x,y,w,h} — all full height, side by side
  const widths = displayOrder.map((pi, di) => di === 0 ? ME_W : OPP_W);
  const geom = [];
  let cx = 0;
  displayOrder.forEach((pi, di) => {
    geom.push({x:cx, y:0, w:widths[di], h:H});
    cx += widths[di] + GAP;
  });

  // ── Draw each panel ───────────────────────────────────────────────────────
  displayOrder.forEach((pi, di) => {
    const p    = players[pi];
    const isMe = di === 0;
    const HDR  = isMe ? HDR_ME : HDR_MINI;
    const FOOT = isMe ? 0 : FOOT_MINI;
    const {x:fx, y:fy, w:fw, h:fh} = geom[di];
    const clr  = p.dead ? "#223344" : p.color;
    const t1   = Date.now() * 0.004;

    // Panel background
    ctx.fillStyle = isMe ? "#07071e" : "#05051a";
    ctx.fillRect(fx, fy, fw, fh);

    // Top colored accent bar
    const topH = 4;
    if(!p.dead){
      const pulse = 0.7 + 0.3 * Math.sin(t1 + di * 0.9);
      ctx.fillStyle = `rgba(${hexRgb(p.color)},${pulse.toFixed(2)})`;
    } else {
      ctx.fillStyle = "#1a1a2e";
    }
    ctx.fillRect(fx, fy, fw, topH);

    // Header background
    ctx.fillStyle = p.dead ? "rgba(10,10,22,0.95)" : `rgba(${hexRgb(p.color)},0.18)`;
    ctx.fillRect(fx, fy + topH, fw, HDR);

    // Header bottom divider line
    ctx.fillStyle = p.dead ? "#1a2233" : `rgba(${hexRgb(p.color)},0.6)`;
    ctx.fillRect(fx, fy + topH + HDR - 2, fw, 2);

    if(isMe){
      // "P1" label left side
      const pnum = `P${pi+1}`;
      ctx.font = `8px ${PX}`;
      ctx.fillStyle = p.dead ? "#334455" : clr;
      if(!p.dead){ ctx.shadowColor = clr; ctx.shadowBlur = 10; }
      ctx.fillText(pnum, fx + 6, fy + topH + HDR - 8);
      ctx.shadowBlur = 0;

      // YOU badge
      const bx = fx + ctx.measureText(pnum).width + 10;
      const by = fy + topH + 5;
      ctx.fillStyle = `rgba(${hexRgb(me.color)},0.25)`;
      ctx.fillRect(bx, by, 22, 12);
      ctx.strokeStyle = me.color; ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, 22, 12);

function checkMultiGameOver(){
  if(state!=="game") return;
  const alive=players.filter(p=>!p.dead);
  if(alive.length===0){
    // All died simultaneously — pick top scorer as winner before clearing lastStanding
    if(!lastStanding) lastStanding=[...players].sort((a,b)=>b.score-a.score)[0]||null;
    state="gameover_multi"; stopBGM();
    if(playerCount>1) setTimeout(()=>initRematch(), 100);
    return;
  }
  if(alive.length===1&&players.length>1){
    if(!lastStanding||lastStanding!==alive[0]){
      lastStanding=alive[0]; lastStandingTimer=180; sfxFanfare();
    }
    if(lastStandingTimer>0) lastStandingTimer--;
    if(lastStandingTimer<=0){
      state="gameover_multi"; stopBGM();
      if(playerCount>1) setTimeout(()=>initRematch(), 100);
    }
    return;
  }
  if(alive.length>1){ lastStanding=null; lastStandingTimer=0; }
}

    "yRatio (0-1) normalises position across pane sizes.",
  ].forEach((l,i)=>ctx.fillText(l,50,398+i*18));
}
function htpPage2(){
  htpBox(30,80,540,52,C.teal); ctx.fillStyle=`rgba(${hexRgb(C.teal)},0.07)`;ctx.fillRect(30,80,540,52);
  htpLabel("TIPS & TRICKS",50,102,C.teal,9);
  ctx.font=`7px ${PX}`; ctx.fillStyle="#99aabb";ctx.fillText("Master Word Arena with these strategies!",50,122);
  const tips=[
    [C.green,"Clear falling words first","They move — stacked rows don't (yet)."],
    [C.teal,"Watch word length badges","Green=short easy, Red=long hard."],
    [C.amber,"Maintain your combo","Even one miss resets it to zero."],
    [C.purple,"Watch opponents' inputs","If they're about to clear — focus on yours."],
    [C.red,"Act before the stack fills","12+ rows = dead. Keep it clear!"],
  ];
  tips.forEach(([clr,title,desc],i)=>{
    const by=150+i*90; htpBox(30,by,540,80,clr);
    ctx.fillStyle=`rgba(${hexRgb(clr)},0.08)`; ctx.fillRect(30,by,540,80);
    htpLabel(title,50,by+20,clr,8);
    ctx.font=`7px ${PX}`; ctx.fillStyle="#99aabb"; ctx.fillText(desc,50,by+46);
  });
}

function drawGlobalCountdownOverlay(){
  ctx.fillStyle="rgba(0,0,0,0.82)"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#05051a"; ctx.fillRect(100,180,400,320);
  ctx.strokeStyle=C.amber; ctx.shadowColor=C.amber; ctx.shadowBlur=24; ctx.lineWidth=2;
  ctx.strokeRect(100,180,400,320); ctx.shadowBlur=0;
  const s=8; ctx.fillStyle=C.amber;
  [[100,180],[496,180],[100,496],[496,496]].forEach(([px,py])=>{ctx.fillRect(px,py,s,2);ctx.fillRect(px,py,2,s);});
  centered("GET READY!",230,C.amber,12,true);
  const pulse=0.85+0.15*Math.sin(Date.now()*0.012);
  ctx.font=`${Math.round(80*pulse)}px ${PX}`; const numStr=`${countdownValue}`,nw=ctx.measureText(numStr).width;
  ctx.shadowColor=C.amber; ctx.shadowBlur=30*pulse; ctx.fillStyle=C.amber;
  ctx.fillText(numStr,W/2-nw/2,390); ctx.shadowBlur=0;
  ctx.font=`8px ${PX}`; const dw=ctx.measureText("MIXED MODE").width;
  pxDraw("MIXED MODE",W/2-dw/2,436,C.purple,8,true);
  centered("GET READY TO TYPE!",462,"#6677aa",7,false);
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function loop(){
  bg();
  if(state==="splash")           drawSplash();
  else if(state==="menu")        menu();
  else if(state==="difficulty")  difficultyMenu();
  else if(state==="multiplayer") multiMenu();
  else if(state==="hostjoin")    hostJoinMenu();
  else if(state==="joingame")    drawJoinGame();
  else if(state==="options")     drawOptions();
  else if(state==="howtoplay")   drawHowToPlay();
  else if(state==="lobby_wait")  lobbyWait();
  else if(state==="game"){
    if(playerCount===1) game();
    else if(playerCount===2) game2P();
    else if(playerCount===4) game4P();
  }
  else if(state==="gameover")       gameover();
  else if(state==="gameover_multi") gameover_multi();

  if(state!=="splash") drawMusicIcon();

  drawClickRipple();

  // Screen fade-in transition — plays whenever the visible state changes
  if(state!==visualState){stateChangeTime=Date.now();visualState=state;}
  const sinceChange=Date.now()-stateChangeTime;
  if(sinceChange<TRANSITION_MS){
    const p=sinceChange/TRANSITION_MS;
    ctx.fillStyle=`rgba(2,2,10,${((1-p)*0.85).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
  }

  // Global countdown overlay — fires even if player navigated to menu
  if(countdownActive && state!=="game" && state!=="lobby_wait" && lobby.role){
    drawGlobalCountdownOverlay();
  }

  if(state!==lastState&&audioReady){
    if(["menu","difficulty","multiplayer","hostjoin","joingame","options","lobby_wait","howtoplay"].includes(state)) startBGM("menu");
    else if(state==="game") startBGM("game");
    lastState=state;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
